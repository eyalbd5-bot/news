<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>חדשות אייל</title>
<meta name="description" content="כדורגל, חדשות ו-AI במקום אחד, בעברית">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="חדשות אייל">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f17'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='Arial' font-weight='900' fill='%2360a5fa'%3Eא%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="top">
  <div class="top-row">
    <a class="brand" href="#" id="brand">
      <span class="logo-mark" aria-hidden="true">א</span>
      <span class="logo-text">חדשות <b>אייל</b></span>
    </a>
    <div class="updated" id="updated" title="זמן העדכון האחרון"></div>
    <div class="actions">
      <button class="icon-btn" id="btnSearch" aria-label="חיפוש" title="חיפוש"></button>
      <button class="icon-btn" id="btnSaved" aria-label="ידיעות שמורות" title="שמורים"><span class="badge" id="savedCount" hidden></span></button>
      <button class="icon-btn" id="btnTheme" aria-label="החלפת מצב תצוגה" title="בהיר / כהה"></button>
    </div>
  </div>
  <div class="search-row" id="searchRow" hidden>
    <input id="q" type="search" placeholder="חיפוש בכל הידיעות…" autocomplete="off" enterkeyhint="search">
    <span class="q-count" id="qCount"></span>
    <button class="icon-btn small" id="btnCloseSearch" aria-label="סגירת חיפוש"></button>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="תחומים"></nav>
<div class="subbar" id="subbar"></div>

<div class="ticker" id="ticker" hidden>
  <div class="ticker-label"><span class="dot"></span>מבזקים</div>
  <div class="ticker-viewport"><div class="ticker-track" id="tickerTrack"></div></div>
</div>

<main id="feed" class="feed" aria-live="polite"></main>

<footer class="foot">
  <button class="link-btn" id="btnStatus">מצב המקורות</button>
  <span id="footInfo"></span>
</footer>

<div class="scrim" id="scrim" hidden></div>

<aside class="reader" id="reader" hidden aria-modal="true" role="dialog">
  <div class="reader-bar">
    <button class="icon-btn" id="btnCloseReader" aria-label="סגירה"></button>
    <div class="reader-bar-actions">
      <button class="icon-btn" id="btnReaderSave" aria-label="שמירה"></button>
      <a class="icon-btn" id="btnReaderOpen" target="_blank" rel="noopener" aria-label="לכתבה המקורית"></a>
    </div>
  </div>
  <div class="reader-body" id="readerBody"></div>
</aside>

<aside class="status" id="status" hidden role="dialog">
  <div class="status-head"><h2>מצב המקורות</h2><button class="icon-btn" id="btnCloseStatus" aria-label="סגירה"></button></div>
  <div class="status-body" id="statusBody"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
